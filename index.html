<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Developer Ankit | Yuth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  @property --stroke { syntax:"<color>"; inherits:true; initial-value:#3ddc97; }
  @property --angle { syntax:"<angle>"; inherits:false; initial-value:0deg; }

  :root {
    --bg:#070809; --card:#0f1419; --line:#1d252d; --text:#f2f5f7; --muted:#9aa6b2;
    --g:#3ddc97; --p:#b388ff; --b:#4cc9f0; --r:#ff5e7e; --y:#ffd166; --o:#ff9f1c;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    margin:0; color:var(--text); font-family:"Space Grotesk", system-ui, sans-serif; line-height:1.55; overflow-x:hidden;
    background:var(--bg);
  }
  /* ---------- Premium color-shifting background ---------- */
  .bgfx { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; background:var(--bg); }
  .bgfx::after { content:""; position:absolute; inset:0; background:linear-gradient(rgba(7,8,9,.55), rgba(7,8,9,.82)); }
  .blob {
    position:absolute; width:62vmax; height:62vmax; border-radius:50%;
    filter:blur(110px); opacity:.42;
    animation:drift 28s ease-in-out infinite alternate, shiftA 24s ease-in-out infinite;
  }
  .b1 { top:-18%; left:-14%; animation-duration:30s, 24s; animation-name:drift1, gold; }
  .b2 { top:30%; right:-22%; animation-duration:34s, 28s; animation-name:drift2, blueRed; }
  .b3 { bottom:-24%; left:12%; animation-duration:26s, 32s; animation-name:drift3, greenBlue; }
  .b4 { top:6%; left:38%; width:48vmax; height:48vmax; animation-duration:22s, 26s; animation-name:drift4, redGold; }

  @keyframes drift1 { 0%,100% { transform:translate(0,0); } 50% { transform:translate(18vw,12vh); } }
  @keyframes drift2 { 0%,100% { transform:translate(0,0); } 50% { transform:translate(-20vw,-10vh); } }
  @keyframes drift3 { 0%,100% { transform:translate(0,0); } 50% { transform:translate(16vw,-14vh); } }
  @keyframes drift4 { 0%,100% { transform:translate(0,0); } 50% { transform:translate(-14vw,16vh); } }

  /* Premium palette: gold, light green, blue, deep red. Each blob cycles slowly. */
  @keyframes gold {
    0%   { background-color:#d9a441; }
    33%  { background-color:#f1d27a; }
    66%  { background-color:#8fd9b0; }
    100% { background-color:#d9a441; }
  }
  @keyframes blueRed {
    0%   { background-color:#2f6fdb; }
    50%  { background-color:#b8232f; }
    100% { background-color:#2f6fdb; }
  }
  @keyframes greenBlue {
    0%   { background-color:#3ddc97; }
    50%  { background-color:#1e3a8a; }
    100% { background-color:#3ddc97; }
  }
  @keyframes redGold {
    0%   { background-color:#e04a4a; }
    50%  { background-color:#f1d27a; }
    100% { background-color:#e04a4a; }
  }
  @keyframes shiftA { to { opacity:.42; } }

  .wrap { position:relative; z-index:1; max-width:1100px; margin:0 auto; padding:0 20px; }

  nav { display:flex; justify-content:space-between; align-items:center; padding:20px 0; }
  nav b { font-family:"Anton", Impact, sans-serif; font-weight:400; font-size:1.3rem; letter-spacing:.1em; background:linear-gradient(90deg,var(--g),var(--b),var(--p),var(--r),var(--y),var(--g)); background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:shift 8s linear infinite; }
  nav a { color:var(--text); text-decoration:none; font-size:.9rem; padding:8px 14px; border:1px solid var(--line); border-radius:999px; }
  nav a:hover { border-color:var(--g); color:var(--g); }

  /* ---------- HERO ---------- */
  .hero { display:grid; grid-template-columns:1.25fr .75fr; gap:32px; align-items:center; min-height:72vh; padding:20px 0 40px; }
  .big { font-family:"Anton", Impact, sans-serif; text-transform:uppercase; font-weight:400; line-height:.92; margin:0; font-size:clamp(3.6rem, 12vw, 9rem); white-space:nowrap; }

  /* Outline DEVELOPER whose color cycles through 6 colours */
  .outline {
    color:transparent;
    -webkit-text-stroke:2px var(--stroke);
    text-shadow:0 0 28px color-mix(in srgb, var(--stroke) 55%, transparent);
    animation:cycle 12s linear infinite;
  }
  @keyframes cycle {
    0%   { --stroke:#ffd166; }
    16%  { --stroke:#3ddc97; }
    33%  { --stroke:#4cc9f0; }
    50%  { --stroke:#b388ff; }
    66%  { --stroke:#ff5e7e; }
    83%  { --stroke:#ff9f1c; }
    100% { --stroke:#ffd166; }
  }

  /* Solid ANKIT with a moving gradient */
  .ankit-word { color:var(--text); }
  @keyframes shift { to { background-position:300% 0; } }

  .letter { display:inline-block; opacity:0; animation:fly 1.1s cubic-bezier(.2,.8,.2,1) forwards; animation-delay:var(--d, 0s); }
  @keyframes fly {
    from { opacity:0; transform:translate(var(--x), var(--y)) rotate(var(--r)) scale(1.8); }
    60%  { opacity:1; }
    to   { opacity:1; transform:none; }
  }

  .join { display:inline-block; margin-top:28px; padding:14px 26px; border-radius:999px; background:linear-gradient(90deg,var(--g),var(--b),var(--p)); color:#04110b; font-weight:700; text-decoration:none; box-shadow:0 10px 30px rgba(76,201,240,.25); transition:transform .2s; }
  .join:hover { transform:translateY(-3px); }
  .join small { display:block; font-weight:600; opacity:.85; font-size:.8rem; }

  .side { display:grid; gap:18px; justify-items:center; }
  .ring { position:relative; width:min(300px,75vw); aspect-ratio:1; border-radius:50%; padding:6px; background:conic-gradient(var(--g),var(--b),var(--p),var(--r),var(--y),var(--g)); animation:spin 8s linear infinite; }
  .ring-inner { position:absolute; inset:6px; border-radius:50%; background:var(--card); display:grid; place-items:center; font-family:"Anton", Impact, sans-serif; font-size:5.5rem; color:var(--g); overflow:hidden; }
  .ring img { position:absolute; inset:0; width:100%; height:100%; border-radius:50%; object-fit:cover; animation:spin-back 8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes spin-back { to { transform:rotate(-360deg); } }

  /* Live "on the bench" panel with typing text */
  .live { width:min(340px,90vw); background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; }
  .live h4 { margin:0 0 10px; font-size:.75rem; letter-spacing:.2em; text-transform:uppercase; color:var(--g); display:flex; align-items:center; gap:8px; }
  .live h4::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--r); box-shadow:0 0 10px var(--r); animation:blink 1.2s infinite; }
  .live p { margin:0; font-size:.92rem; min-height:1.5em; color:var(--text); }
  .caret { display:inline-block; width:7px; height:1em; background:var(--y); vertical-align:-2px; margin-left:2px; animation:blink .8s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }

  /* ---------- STATS ---------- */
  .stats { display:flex; gap:14px; flex-wrap:wrap; }
  .stat { flex:1 1 180px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; position:relative; overflow:hidden; }
  .stat::before { content:""; position:absolute; inset:0 0 auto 0; height:3px; background:var(--c); }
  .stat b { display:block; font-family:"Anton", Impact, sans-serif; font-weight:400; font-size:2.2rem; color:var(--c); line-height:1.1; }
  .stat span { color:var(--muted); font-size:.85rem; }

  /* ---------- SECTIONS ---------- */
  .block { padding:72px 0 10px; }
  .label { font-size:.85rem; letter-spacing:.2em; text-transform:uppercase; margin:0 0 6px; color:var(--c, var(--g)); }
  h2 { font-family:"Anton", Impact, sans-serif; font-weight:400; text-transform:uppercase; font-size:clamp(2.2rem,6vw,3.6rem); line-height:1; margin:8px 0 24px; }
  .about { color:var(--muted); max-width:640px; font-size:1.05rem; }

  /* ---------- BOT CARDS (with live scene) ---------- */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:18px; }
  .bot {
    position:relative; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:0 0 20px;
    display:flex; flex-direction:column; text-decoration:none; color:inherit; overflow:hidden;
    transition:border-color .2s, transform .2s, box-shadow .2s;
  }
  .bot:hover { border-color:var(--c); transform:translateY(-5px); box-shadow:0 12px 30px -10px var(--c); }
  .bot::before { content:""; position:absolute; inset:0 0 auto 0; height:4px; background:var(--c); z-index:2; }

  .scene { position:relative; height:130px; margin:0 0 14px; background:radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--c) 16%, transparent), transparent 70%); border-bottom:1px solid var(--line); overflow:hidden; }
  .dev { position:absolute; top:50%; transform:translateY(-50%); width:44px; height:64px; border:2px solid var(--c); border-radius:8px; }
  .dev.laptop { width:86px; height:56px; border-radius:6px; }
  .dev.phone { left:18px; }
  .dev.laptop { right:18px; }
  .dev::after { content:""; position:absolute; inset:8px 6px; background:repeating-linear-gradient(to bottom, color-mix(in srgb,var(--c) 45%,transparent) 0 3px, transparent 3px 9px); opacity:.7; }
  .path { position:absolute; left:70px; right:112px; top:50%; height:2px; background:color-mix(in srgb,var(--c) 35%,transparent); }
  .dot { position:absolute; top:calc(50% - 4px); width:8px; height:8px; border-radius:50%; background:var(--c); box-shadow:0 0 12px var(--c); left:70px; animation:travel 2.4s linear infinite; }
  .dot.d2 { animation-delay:.8s; }
  .dot.d3 { animation-delay:1.6s; }
  @keyframes travel { from { left:70px; opacity:0; } 10% { opacity:1; } 90% { opacity:1; } to { left:calc(100% - 112px); opacity:0; } }
  .cursor { position:absolute; width:14px; height:14px; border-radius:2px; background:var(--y); top:30%; left:40%; animation:roam 4s ease-in-out infinite; }
  @keyframes roam { 0%,100% { transform:translate(0,0); } 25% { transform:translate(60px,-18px); } 50% { transform:translate(10px,22px); } 75% { transform:translate(-40px,8px); } }
  .tag { position:absolute; left:50%; top:12px; transform:translateX(-50%); font-size:.7rem; padding:3px 10px; border-radius:99px; background:var(--c); color:#04110b; font-weight:700; letter-spacing:.06em; white-space:nowrap; }

  .bot-body { padding:0 22px; display:flex; flex-direction:column; gap:10px; }
  .bot-top { display:flex; align-items:center; gap:12px; }
  .av { width:52px; height:52px; flex:0 0 52px; border-radius:50%; object-fit:cover; border:2px solid var(--c); background:#1a2530; display:flex; align-items:center; justify-content:center; font-family:"Anton", Impact, sans-serif; font-size:1.4rem; color:var(--c); }
  .bot h3 { margin:0; font-size:1.02rem; word-break:break-word; }
  .uname { color:var(--c); font-size:.86rem; }
  .bio { color:var(--muted); font-size:.9rem; margin:0; }
  .go { margin-top:4px; color:var(--c); font-weight:700; font-size:.88rem; }

  /* ---------- CHANNELS ---------- */
  .channels { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:18px; }
  .chan { display:flex; gap:14px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px; text-decoration:none; color:inherit; position:relative; overflow:hidden; transition:transform .2s, border-color .2s; }
  .chan::before { content:""; position:absolute; inset:0 auto 0 0; width:4px; background:var(--c); }
  .chan:hover { transform:translateY(-4px); border-color:var(--c); }
  .chan h3 { margin:0; font-size:1rem; word-break:break-word; }
  .chan .uname { font-size:.86rem; }
  .chan .go { margin-left:auto; white-space:nowrap; }

  .reveal { opacity:0; transform:translateY(26px); transition:opacity .7s ease, transform .7s ease; }
  .reveal.show { opacity:1; transform:none; }

  footer { text-align:center; color:var(--muted); padding:60px 0 30px; font-size:.9rem; border-top:1px solid var(--line); margin-top:60px; }
  footer a { color:var(--g); text-decoration:none; }

  @media (max-width:760px) {
    .hero { grid-template-columns:1fr; text-align:center; min-height:auto; }
    .big { white-space:normal; }
    .join { display:block; }
    .side { order:-1; }
    .stats { justify-content:center; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
    .blob { opacity:.35; }
    .letter { opacity:1; transform:none; }
    .reveal { opacity:1; transform:none; }
  }
</style>
</head>
<body>
<div class="bgfx" aria-hidden="true">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
  <span class="blob b4"></span>
</div>
<div class="wrap">
  <nav>
    <b>ANKIT</b>
    <a id="navJoin" href="#" target="_blank" rel="noopener">Telegram</a>
  </nav>

  <header class="hero">
    <div>
      <h1 class="big outline" id="title1" aria-label="Developer">DEVELOPER</h1>
      <h1 class="big ankit-word" id="title2" aria-label="Ankit">ANKIT.</h1>
      <a class="join" id="joinBtn" href="#" target="_blank" rel="noopener"></a>
    </div>
    <div class="side">
      <div class="ring">
        <div class="ring-inner"><span id="photoLetter"></span></div>
        <img src="profile.jpg" alt="Ankit" onerror="this.style.display='none'">
      </div>
      <div class="live">
        <h4>Live</h4>
        <p><span id="typed"></span><span class="caret"></span></p>
      </div>
    </div>
  </header>

  <div class="stats">
    <div class="stat" style="--c:var(--g)"><b id="botCount"></b><span>Bots</span></div>
    <div class="stat" style="--c:var(--p)"><b id="chanCount"></b><span>Channels</span></div>
    <div class="stat" style="--c:var(--r)"><b>Telegram</b><span>Platform</span></div>
  </div>

  <section class="block reveal" id="about">
    <p class="label" style="--c:var(--b)">About</p>
    <h2>Who I am</h2>
    <p class="about" id="aboutText"></p>
  </section>

  <section class="block reveal" id="bots">
    <p class="label" style="--c:var(--y)">Projects</p>
    <h2>My bots</h2>
    <div class="grid" id="botGrid"></div>
  </section>

  <section class="block reveal" id="channels">
    <p class="label" style="--c:var(--r)">Channels</p>
    <h2>Follow along</h2>
    <div class="channels" id="chanGrid"></div>
  </section>
</div>

<footer>© <span id="footerName"></span> · <a id="footerTg" href="#" target="_blank" rel="noopener"></a></footer>

<script>
// ===== Edit your info here =====
const ME = {
  name: "Ankit",
  title: "Developer",
  telegram: "https://t.me/ankit_x_x_1",
  telegramHandle: "@ankit_x_x_1",
  about: "Telegram bots for groups, music and security. Everything is built to be simple to use and fast to open."
};

// display: channel name (copied from the channel's Telegram name)
// username: without @
const CHANNELS = [
  { display: "𝐘ᴜᴛᴀ 𝐁ᴏᴛ 𝐇ᴜʙ", username: "yutabothub", photo: "channel-1.jpg" },
  { display: "𝐋ᴇᴀᴅ 𝐁ʏ 𝐀ɴᴋɪᴛ", username: "X_Ankitsopurts", photo: "channel-2.jpg" }
];

// display: bot's display name (its Telegram name)
// username: bot's @username, without @
// bio: the bot's Bio text (from its Telegram profile)
// photo: path to a custom photo (leave empty to use the bot's Telegram photo)
const BOTS = [
  { display: "𝐅𝐑𝐎𝐍𝐓 𝐌𝐄𝐃𝐈𝐀 <||>",     username: "Name_style_maker_bot", bio: "Make your name stylish ✨ Tons of unique designs, cool fonts & symbols, and ready-made bios. Easy copy & paste.", photo: "name-style.jpg" },
  { display: "⌁ ᖴ ᴜ s ꭵ ꭷ и",            username: "Groupsecurity_xbot",   bio: "Fusion is a Telegram group management bot. It keeps your group clean, safe and organised, with moderation, group protection, join requests and more.", photo: "group-security.jpg" },
  { display: "𓆩 𝙔𝙐𝙏𝘼 𝙎𝙀𝘾𝙐𝙍𝙄𝙏𝙔 🛡️ 𓆪",     username: "Yutasecurebot",        bio: "AI-powered NSFW content moderator for Telegram groups. It scans every sticker and photo in real time and removes explicit content instantly.", photo: "yuta-secure.jpg" }
];
// ===============================

const COLORS = ["#3ddc97", "#4cc9f0", "#b388ff", "#ff5e7e", "#ffd166", "#ff9f1c"];

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function rand(min, max) { return Math.round(Math.random() * (max - min) + min); }

// Letters fly in from scattered positions and join together
function flyLetters(el, text, colored) {
  el.innerHTML = [...text].map((ch, i) => {
    const color = colored ? `color:${COLORS[i % COLORS.length]};` : "";
    const style = `${color}--x:${rand(-400, 400)}px;--y:${rand(-260, 260)}px;--r:${rand(-90, 90)}deg;--d:${(i * 0.07).toFixed(2)}s`;
    return `<span class="letter" style="${style}">${ch === " " ? "&nbsp;" : esc(ch)}</span>`;
  }).join("");
}

// Typing loop for the "Live" panel
function startTyping() {
  const lines = [
    ...BOTS.map(b => `Building ${b.display} · @${b.username}`),
    ...CHANNELS.map(c => `Posting updates to @${c.username}`),
    "Shipping the next release…"
  ];
  const el = document.getElementById("typed");
  let li = 0, ci = 0, deleting = false;
  function tick() {
    const line = lines[li];
    if (!deleting) {
      ci++;
      el.textContent = line.slice(0, ci);
      if (ci === line.length) { deleting = true; return setTimeout(tick, 1600); }
      return setTimeout(tick, 45);
    }
    ci--;
    el.textContent = line.slice(0, ci);
    if (ci === 0) { deleting = false; li = (li + 1) % lines.length; return setTimeout(tick, 300); }
    setTimeout(tick, 20);
  }
  tick();
}

function render() {
  flyLetters(document.getElementById("title1"), "DEVELOPER");
  flyLetters(document.getElementById("title2"), ME.name.toUpperCase() + ".", true);

  const join = document.getElementById("joinBtn");
  join.href = ME.telegram;
  join.innerHTML = `Join me on Telegram<small>${esc(ME.telegramHandle)}</small>`;
  document.getElementById("navJoin").href = ME.telegram;
  document.getElementById("navJoin").textContent = ME.telegramHandle;

  document.getElementById("photoLetter").textContent = ME.name.charAt(0);
  document.getElementById("botCount").textContent = BOTS.length;
  document.getElementById("chanCount").textContent = CHANNELS.length;
  document.getElementById("aboutText").textContent = ME.about;
  document.getElementById("footerName").textContent = ME.name;
  const ft = document.getElementById("footerTg");
  ft.href = ME.telegram;
  ft.textContent = ME.telegramHandle;
  document.title = `${ME.title} ${ME.name} | Yuth`;

  // Bots
  const grid = document.getElementById("botGrid");
  grid.innerHTML = BOTS.map((b, i) => {
    const color = COLORS[i % COLORS.length];
    const letter = esc((b.display || b.username || "?").trim().charAt(0).toUpperCase());
    const src = b.photo || `https://t.me/i/userpic/320/${encodeURIComponent(b.username)}.jpg`;
    return `
      <a class="bot reveal" style="--c:${color}" href="https://t.me/${encodeURIComponent(b.username)}" target="_blank" rel="noopener">
        <div class="scene">
          <span class="tag">LIVE</span>
          <div class="dev phone"></div>
          <div class="path"></div>
          <span class="dot"></span><span class="dot d2"></span><span class="dot d3"></span>
          <div class="dev laptop"></div>
          <span class="cursor"></span>
        </div>
        <div class="bot-body">
          <div class="bot-top">
            <img class="av" src="${esc(src)}" alt="" data-letter="${letter}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'av',textContent:this.dataset.letter}))">
            <div>
              <h3>${esc(b.display)}</h3>
              <div class="uname">@${esc(b.username)}</div>
            </div>
          </div>
          <p class="bio">${esc(b.bio)}</p>
          <span class="go">Open in Telegram →</span>
        </div>
      </a>`;
  }).join("");

  // Channels
  document.getElementById("chanGrid").innerHTML = CHANNELS.map((c, i) => {
    const color = COLORS[(i + 2) % COLORS.length];
    const letter = esc((c.display || c.username).trim().charAt(0).toUpperCase());
    const src = c.photo || `https://t.me/i/userpic/320/${encodeURIComponent(c.username)}.jpg`;
    return `
      <a class="chan reveal" style="--c:${color}" href="https://t.me/${encodeURIComponent(c.username)}" target="_blank" rel="noopener">
        <img class="av" src="${esc(src)}" alt="" data-letter="${letter}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'av',textContent:this.dataset.letter}))">
        <div>
          <h3>${esc(c.display)}</h3>
          <div class="uname">@${esc(c.username)}</div>
        </div>
        <span class="go">Join →</span>
      </a>`;
  }).join("");

  startTyping();
}

render();

const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add("show"); io.unobserve(e.target); }
  });
}, { threshold: 0.15 });
document.querySelectorAll(".reveal").forEach(el => io.observe(el));
</script>
</body>
</html>
